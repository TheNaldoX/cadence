# ---------------------------------------------------------------------------
# Compile l'APK de Cadence sur les serveurs de GitHub.
#
# Rien a installer sur ta machine : GitHub fournit le JDK, le SDK Android et
# Gradle. A chaque envoi de code, l'APK est produit, mis a disposition en
# telechargement, et publie dans les releases pour pouvoir etre installe
# directement depuis le navigateur du telephone.
# ---------------------------------------------------------------------------
name: APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Compiler l'APK de debug
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      # La compilation. Le cache de configuration est desactive ici : il
      # n'apporte rien sur un serveur neuf et complique les diagnostics.
      - name: Compiler
        run: gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Preparer le fichier
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/cadence-debug.apk
          echo "Taille : $(du -h out/cadence-debug.apk | cut -f1)"

      - name: Mettre l'APK en telechargement
        uses: actions/upload-artifact@v4
        with:
          name: cadence-apk
          path: out/cadence-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Une release donne une adresse stable et publique : on peut l'ouvrir
      # depuis le telephone et installer l'APK sans passer par un ordinateur.
      - name: Publier dans les releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Cadence — dernier APK de debug
          body: |
            APK compile automatiquement depuis le commit ${{ github.sha }}.

            Ouvre cette page depuis ton telephone, telecharge le fichier, puis
            autorise l'installation depuis des sources inconnues quand Android
            le demande.
          files: out/cadence-debug.apk
          prerelease: true
